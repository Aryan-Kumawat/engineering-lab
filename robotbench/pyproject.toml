[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robotbench-local"
version = "0.1.0"
description = "Reproducible robot servo experiments, replay and failure inspection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
license = "MIT"
authors = [{name = "Aryan Kumawat"}]
readme = "README.md"

[project.scripts]
robotbench = "robotbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotbench = ["resources/*.urdf", "resources/*.json"]
