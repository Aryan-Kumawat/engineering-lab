name: RobotBench checks
on:
  push:
    paths:
      - 'robotbench/**'
      - '.github/workflows/robotbench.yml'
  pull_request:
    paths:
      - 'robotbench/**'
      - '.github/workflows/robotbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./robotbench
      - run: python -m unittest discover -s robotbench/tests -v
      - run: python -m robotbench --version
